[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secondpath"
version = "0.1.0a1"
description = "Second-path runtime protection for user-facing AI workflows"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "SecondPath Contributors" },
]
keywords = ["ai", "llm", "fallback", "workflow", "reliability", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secondpath"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
